<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF14 アルカディアンドリーム 攻略ヒント</title>
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-tertiary: #0f3460;
            --text-primary: #eee;
            --text-secondary: #ccc;
            --accent: #e94560;
            --accent-hover: #c73552;
            --border: #0f3460;
        }

        [data-theme="light"] {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e0e0e0;
            --text-primary: #333;
            --text-secondary: #666;
            --accent: #2196F3;
            --accent-hover: #1976D2;
            --border: #ddd;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Meiryo', 'Segoe UI', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
            min-height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: var(--bg-secondary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            color: var(--accent);
            font-size: 24px;
        }

        .header-controls {
            display: flex;
            gap: 10px;
        }

        .theme-toggle, .clear-btn {
            padding: 10px 20px;
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            border: 2px solid var(--border);
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .theme-toggle:hover, .clear-btn:hover {
            background-color: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .left-panel {
            width: 400px;
            overflow-y: auto;
            padding: 20px;
            background-color: var(--bg-primary);
            border-right: 2px solid var(--border);
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        @media (max-width: 1024px) {
            .main-content {
                flex-direction: column;
            }
            
            .left-panel {
                width: 100%;
                border-right: none;
                border-bottom: 2px solid var(--border);
            }
        }

        .section {
            background-color: var(--bg-secondary);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            margin-bottom: 15px;
        }

        .section h2 {
            color: var(--accent);
            margin-bottom: 12px;
            font-size: 16px;
            display: flex;
            align-items: center;
        }

        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* 散開位置の特殊レイアウト */
        .position-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 300px;
            margin: 0 auto;
        }

        .position-grid .pos-A { grid-column: 2; grid-row: 1; }
        .position-grid .pos-1 { grid-column: 1; grid-row: 2; }
        .position-grid .pos-2 { grid-column: 3; grid-row: 2; }
        .position-grid .pos-D { grid-column: 1; grid-row: 3; }
        .position-grid .pos-B { grid-column: 3; grid-row: 3; }
        .position-grid .pos-4 { grid-column: 1; grid-row: 4; }
        .position-grid .pos-3 { grid-column: 3; grid-row: 4; }
        .position-grid .pos-C { grid-column: 2; grid-row: 5; }

        button.choice-btn {
            padding: 10px 16px;
            font-size: 14px;
            border: 2px solid var(--border);
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 80px;
        }

        button.choice-btn:hover {
            background-color: var(--accent);
            border-color: var(--accent);
            color: white;
            transform: translateY(-2px);
        }

        button.choice-btn.selected {
            background-color: var(--accent);
            border-color: var(--accent);
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(233, 69, 96, 0.4);
        }

        [data-theme="light"] button.choice-btn.selected {
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.4);
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-incomplete {
            background-color: #ff6b6b;
        }

        .status-complete {
            background-color: #51cf66;
        }

        #map-container {
            background-color: var(--bg-secondary);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        #map-container h2 {
            color: var(--accent);
            margin-bottom: 15px;
            font-size: 18px;
        }

        .map-wrapper {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        #map-canvas {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }

        #result {
            background-color: var(--bg-secondary);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        #result h2 {
            color: var(--accent);
            margin-bottom: 15px;
            font-size: 18px;
        }

        #hint {
            line-height: 1.8;
            font-size: 15px;
        }

        .hint-step {
            margin-bottom: 12px;
            padding: 12px;
            background-color: var(--bg-tertiary);
            border-radius: 5px;
            border-left: 4px solid var(--accent);
        }

        .hint-step strong {
            color: var(--accent);
            display: block;
            margin-bottom: 5px;
        }

        .hint-detail {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .timeline {
            background-color: var(--bg-primary);
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
        }

        .timeline-step {
            display: flex;
            align-items: flex-start;
            margin-bottom: 10px;
            padding: 8px;
            background-color: var(--bg-tertiary);
            border-radius: 5px;
        }

        .timeline-number {
            background-color: var(--accent);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .timeline-content {
            flex: 1;
            font-size: 14px;
        }

        footer {
            text-align: center;
            padding: 15px;
            color: var(--text-secondary);
            font-size: 12px;
            background-color: var(--bg-secondary);
        }
    </style>
</head>
<body data-theme="dark">
    <div class="container">
        <header>
            <h1>🎮 アルカディアンドリーム 攻略ヒント</h1>
            <div class="header-controls">
                <button class="theme-toggle" onclick="toggleTheme()">🌓 テーマ切替</button>
                <button class="clear-btn" onclick="clearAll()">🔄 選択クリア</button>
            </div>
        </header>

        <div class="main-content">
            <!-- 左パネル：ボタン -->
            <div class="left-panel">
                <div class="section">
                    <h2><span class="status-indicator status-incomplete" id="status-0"></span>⓪ 担当</h2>
                    <div class="button-group">
                        <button class="choice-btn" onclick="select(0, 'MT')">MT組</button>
                        <button class="choice-btn" onclick="select(0, 'ST')">ST組</button>
                    </div>
                </div>

                <div class="section">
                    <h2><span class="status-indicator status-incomplete" id="status-1"></span>① 初手パターン</h2>
                    <div class="button-group">
                        <button class="choice-btn" onclick="select(1, 'X')">X字先</button>
                        <button class="choice-btn" onclick="select(1, '+')">十字先</button>
                    </div>
                </div>

                <div class="section">
                    <h2><span class="status-indicator status-incomplete" id="status-2"></span>② 散開位置</h2>
                    <div class="position-grid">
                        <button class="choice-btn pos-A" onclick="select(2, 'A')">A</button>
                        <button class="choice-btn pos-1" onclick="select(2, '1')">1</button>
                        <button class="choice-btn pos-2" onclick="select(2, '2')">2</button>
                        <button class="choice-btn pos-D" onclick="select(2, 'D')">D</button>
                        <button class="choice-btn pos-B" onclick="select(2, 'B')">B</button>
                        <button class="choice-btn pos-4" onclick="select(2, '4')">4</button>
                        <button class="choice-btn pos-3" onclick="select(2, '3')">3</button>
                        <button class="choice-btn pos-C" onclick="select(2, 'C')">C</button>
                    </div>
                </div>

                <div class="section">
                    <h2><span class="status-indicator status-incomplete" id="status-3"></span>③ 安置位置</h2>
                    <div class="button-group">
                        <button class="choice-btn" onclick="select(3, '北')">北（１，２）安置</button>
                        <button class="choice-btn" onclick="select(3, '南')">南（３，４）安置</button>
                    </div>
                </div>

                <div class="section">
                    <h2><span class="status-indicator status-incomplete" id="status-4"></span>④ 処理順序</h2>
                    <div class="button-group">
                        <button class="choice-btn" onclick="select(4, '頭割り')">頭割り先</button>
                        <button class="choice-btn" onclick="select(4, '円範囲')">円範囲先</button>
                    </div>
                </div>

                <div class="section">
                    <h2><span class="status-indicator status-incomplete" id="status-5"></span>⑤ 分身位置</h2>
                    <div class="button-group">
                        <button class="choice-btn" onclick="select(5, '北分身')">北分身</button>
                        <button class="choice-btn" onclick="select(5, '南分身')">南分身</button>
                    </div>
                </div>
            </div>

            <!-- 右パネル：結果とマップ -->
            <div class="right-panel">
                <div id="map-container">
                    <h2>🗺️ フィールドマップ</h2>
                    <div class="map-wrapper">
                        <canvas id="map-canvas" width="600" height="600"></canvas>
                    </div>
                </div>

                <div id="result">
                    <h2>📋 攻略ヒント</h2>
                    <div id="hint">すべての項目を選択してください</div>
                </div>
            </div>
        </div>

        <footer>
            <p>FF14 高難易度コンテンツ「至天の座アルカディア ヘビー級零式4層後半」攻略支援ツール</p>
        </footer>
    </div>

    <script>
        // 選択状態を保存
        const selections = {
            0: null, // 担当（リセット対象外）
            1: null, // 初手パターン
            2: null, // 散開位置
            3: null, // 安置位置
            4: null, // 処理順序
            5: null  // 分身位置
        };

        // テーマ切り替え
        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            drawMap();
        }

        // ページ読み込み時にテーマを復元
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.body.setAttribute('data-theme', savedTheme);
            drawMap();
        });

        // 選択処理
        function select(category, value) {
            selections[category] = value;
            
            const section = document.querySelectorAll('.section')[category];
            const buttons = section.querySelectorAll('button.choice-btn');
            buttons.forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');
            
            updateStatusIndicators();
            calculateHint();
            drawMap();
        }

        // ステータスインジケーター更新
        function updateStatusIndicators() {
            for (let i = 0; i <= 5; i++) {
                const indicator = document.getElementById(`status-${i}`);
                if (selections[i] !== null) {
                    indicator.classList.remove('status-incomplete');
                    indicator.classList.add('status-complete');
                } else {
                    indicator.classList.remove('status-complete');
                    indicator.classList.add('status-incomplete');
                }
            }
        }

        // すべてクリア（MT/ST組は除外）
        function clearAll() {
            for (let key = 1; key <= 5; key++) {
                selections[key] = null;
            }
            
            const sections = document.querySelectorAll('.section');
            for (let i = 1; i < sections.length; i++) {
                sections[i].querySelectorAll('button.choice-btn').forEach(btn => {
                    btn.classList.remove('selected');
                });
            }
            
            updateStatusIndicators();
            document.getElementById('hint').innerHTML = 'すべての項目を選択してください';
            drawMap();
        }

        // ヒント計算（実践的な攻略ロジック）
        function calculateHint() {
            if (Object.values(selections).some(v => v === null)) {
                document.getElementById('hint').innerHTML = 
                    '<div style="text-align: center; padding: 20px; color: var(--text-secondary);">すべての項目を選択してください</div>';
                return;
            }

            const role = selections[0]; // MT or ST
            const pattern = selections[1]; // X or +
            const position = selections[2]; // A,B,C,D,1,2,3,4
            const safe = selections[3]; // 北 or 南
            const order = selections[4]; // 頭割り or 円範囲
            const clone = selections[5]; // 北分身 or 南分身

            // 初手位置の判定
            let firstMove = '';
            if (pattern === 'X') {
                if (['A', '1'].includes(position)) firstMove = '北西';
                else if (['2', 'B'].includes(position)) firstMove = '北東';
                else if (['3', 'C'].includes(position)) firstMove = '南東';
                else if (['4', 'D'].includes(position)) firstMove = '南西';
            } else { // +
                if (['A', '1', '2'].includes(position)) firstMove = '北';
                else if (['B', '2', '3'].includes(position)) firstMove = '東';
                else if (['C', '3', '4'].includes(position)) firstMove = '南';
                else if (['D', '4', '1'].includes(position)) firstMove = '西';
            }

            // 安置移動の判定
            let safeMove = '';
            if (safe === '北') {
                safeMove = '北半分（１��２マーカー側）';
            } else {
                safeMove = '南半分（３，４マーカー側）';
            }

            // 処理順序の詳細
            let orderDetail = '';
            if (order === '頭割り') {
                orderDetail = '頭割り（スタック）を先に処理 → その後散開して円範囲（ドーナツ）を受ける';
            } else {
                orderDetail = '円範囲（ドーナツ）を先に散開位置で処理 → その後集合して頭割り（スタック）を受ける';
            }

            // 分身の注意点
            let cloneNote = '';
            if (clone === '北分身') {
                cloneNote = '北側の分身から扇範囲攻撃が来るので、南側が比較的安全';
            } else {
                cloneNote = '南側の分身から扇範囲攻撃が来るので、北側が比較的安全';
            }

            // タイムライン生成
            const timeline = generateTimeline(role, pattern, position, safe, order, clone);

            let hint = `
                <div class="hint-step">
                    <strong>🎯 担当: ${role}組</strong>
                    <div class="hint-detail">あなたは${role}組として行動します</div>
                </div>
                
                <div class="hint-step">
                    <strong>🔸 初手: ${pattern}字パターン → ${firstMove}へ</strong>
                    <div class="hint-detail">${pattern}字の安全地帯である${firstMove}方向に移動してください</div>
                </div>
                
                <div class="hint-step">
                    <strong>📍 散開位置: ${position}番</strong>
                    <div class="hint-detail">散開が必要なときは必ず${position}マーカー位置へ</div>
                </div>
                
                <div class="hint-step">
                    <strong>✅ 安置: ${safeMove}</strong>
                    <div class="hint-detail">AOE回避のため${safeMove}へ移動</div>
                </div>
                
                <div class="hint-step">
                    <strong>⚔️ 処理順序</strong>
                    <div class="hint-detail">${orderDetail}</div>
                </div>
                
                <div class="hint-step">
                    <strong>👤 分身: ${clone}</strong>
                    <div class="hint-detail">${cloneNote}</div>
                </div>

                <div class="timeline">
                    <strong style="color: var(--accent); display: block; margin-bottom: 10px;">⏱️ 動きのタイムライン</strong>
                    ${timeline}
                </div>
            `;

            document.getElementById('hint').innerHTML = hint;
        }

        // タイムライン生成
        function generateTimeline(role, pattern, position, safe, order, clone) {
            let steps = [];

            steps.push(`${pattern}字方向（${position}番の方向）へ移動`);
            steps.push(`${safe}側の安置エリアへ移動`);
            
            if (order === '頭割り') {
                steps.push(`頭割り位置に集合してスタックを受ける`);
                steps.push(`${position}番散開位置へ移動して円範囲を処理`);
            } else {
                steps.push(`${position}番散開位置で円範囲を処理`);
                steps.push(`頭割り位置に集合してスタックを受ける`);
            }

            steps.push(`${clone}の扇範囲を避けながら次の位置へ`);
            steps.push(`デバフを確認して次のギミックに備える`);

            return steps.map((step, index) => `
                <div class="timeline-step">
                    <div class="timeline-number">${index + 1}</div>
                    <div class="timeline-content">${step}</div>
                </div>
            `).join('');
        }

        // マップ描画
        function drawMap() {
            const canvas = document.getElementById('map-canvas');
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;

            // 背景グラデーション
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, width / 2);
            gradient.addColorStop(0, '#6b5d52');
            gradient.addColorStop(0.5, '#4a3d35');
            gradient.addColorStop(1, '#2a1a15');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, width / 2, 0, 2 * Math.PI);
            ctx.fill();

            // X字のパターン
            ctx.strokeStyle = 'rgba(150, 120, 90, 0.3)';
            ctx.lineWidth = 80;
            ctx.beginPath();
            ctx.moveTo(50, 50);
            ctx.lineTo(550, 550);
            ctx.moveTo(550, 50);
            ctx.lineTo(50, 550);
            ctx.stroke();

            // 散開位置マーカー
            const positions = {
                'A': { x: centerX, y: 80, color: '#d946a6', label: 'A' },
                '1': { x: 150, y: 200, color: '#d946a6', label: '1' },
                'D': { x: 100, y: centerY, color: '#a855f7', label: 'D' },
                '4': { x: 150, y: 400, color: '#a855f7', label: '4' },
                'C': { x: centerX, y: 520, color: '#60a5fa', label: 'C' },
                '3': { x: 450, y: 400, color: '#60a5fa', label: '3' },
                'B': { x: 500, y: centerY, color: '#fbbf24', label: 'B' },
                '2': { x: 450, y: 200, color: '#fbbf24', label: '2' }
            };

            // 各マーカーを描画
            Object.keys(positions).forEach(pos => {
                const p = positions[pos];
                const isSelected = selections[2] === pos;
                const size = isSelected ? 35 : 28;
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, size, 0, 2 * Math.PI);
                ctx.strokeStyle = p.color;
                ctx.lineWidth = 3;
                ctx.stroke();
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, size - 5, 0, 2 * Math.PI);
                ctx.fillStyle = isSelected ? p.color : 'rgba(0, 0, 0, 0.6)';
                ctx.fill();
                
                ctx.fillStyle = isSelected ? '#000' : '#fff';
                ctx.font = isSelected ? 'bold 24px Arial' : 'bold 20px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(p.label, p.x, p.y);
            });

            // 初手パターンを強調
            if (selections[1]) {
                ctx.strokeStyle = '#fbbf24';
                ctx.lineWidth = 6;
                ctx.setLineDash([15, 10]);
                
                if (selections[1] === 'X') {
                    ctx.beginPath();
                    ctx.moveTo(100, 100);
                    ctx.lineTo(500, 500);
                    ctx.moveTo(500, 100);
                    ctx.lineTo(100, 500);
                    ctx.stroke();
                } else if (selections[1] === '+') {
                    ctx.beginPath();
                    ctx.moveTo(centerX, 80);
                    ctx.lineTo(centerX, 520);
                    ctx.moveTo(80, centerY);
                    ctx.lineTo(520, centerY);
                    ctx.stroke();
                }
                
                ctx.setLineDash([]);
            }

            // 安置エリアを表示
            if (selections[3]) {
                ctx.save();
                ctx.globalAlpha = 0.2;
                ctx.fillStyle = '#51cf66';
                
                ctx.beginPath();
                ctx.arc(centerX, centerY, width / 2, 0, 2 * Math.PI);
                ctx.clip();
                
                if (selections[3] === '北') {
                    ctx.fillRect(0, 0, width, centerY);
                } else if (selections[3] === '南') {
                    ctx.fillRect(0, centerY, width, centerY);
                }
                ctx.restore();
            }

            // 分身位置
            if (selections[5]) {
                const cloneY = selections[5] === '北分身' ? 50 : height - 50;
                ctx.fillStyle = '#e94560';
                ctx.font = 'bold 28px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('👤', centerX, cloneY);
            }
        }

        // 初期化
        window.addEventListener('load', () => {
            drawMap();
            updateStatusIndicators();
        });

        window.addEventListener('resize', drawMap);
    </script>
</body>
</html>
